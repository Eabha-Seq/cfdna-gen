# Public WisecondorX + alignment QC environment.
# Published EabhaSeq claim used WisecondorX v1.2.10.
# Bioconda currently publishes 1.2.9 then 1.3.x (no 1.2.10 tarball).
# Pin 1.2.9 so `conda env create` resolves. If your solver can see 1.2.10,
# change the pin below. CLI is `wisecondorx convert|newref|predict`.
name: eabhaseq-wx
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python>=3.10
  - wisecondorx=1.2.9
  - bwa
  - samtools
  - curl
  - unzip
